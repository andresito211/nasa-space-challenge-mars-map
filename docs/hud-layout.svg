<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <radialGradient id="mars" cx="55%" cy="45%" r="70%">
      <stop offset="0" stop-color="#b8643a"/><stop offset=".6" stop-color="#7a3a22"/><stop offset="1" stop-color="#2a120b"/>
    </radialGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="rgba(57,215,255,.05)"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="560" fill="#05070a"/>
  <rect x="0" y="0" width="960" height="560" fill="url(#mars)"/>
  <rect width="960" height="560" fill="url(#scan)"/>
  <!-- craters (decor) -->
  <g fill="none" stroke="rgba(0,0,0,.35)" stroke-width="2">
    <circle cx="610" cy="300" r="70"/><circle cx="430" cy="200" r="22"/><circle cx="700" cy="420" r="30"/><circle cx="380" cy="380" r="16"/>
  </g>
  <!-- hazards -->
  <circle cx="520" cy="330" r="34" fill="rgba(255,60,60,.18)" stroke="#ff6060" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="520" y="334" fill="#ff8a8a" font-size="9" text-anchor="middle" font-weight="bold">⚠ HAZARD · R 2 KM</text>
  <circle cx="455" cy="265" r="18" fill="rgba(255,170,60,.14)" stroke="#ffaa3c" stroke-dasharray="2 3"/>
  <text x="455" y="250" fill="#ffc88c" font-size="8" text-anchor="middle">⚠ CRATER 3.6 KM</text>
  <!-- route -->
  <path d="M600 410 L560 380 L470 330 L470 300 L400 250 L330 215" fill="none" stroke="rgba(57,215,255,.4)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 410 L560 380 L470 330 L470 300 L400 250 L330 215" fill="none" stroke="#f0fcff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="rgba(0,0,0,.35)" stroke="#39d7ff" stroke-width="2"><circle cx="470" cy="330" r="8"/><circle cx="470" cy="300" r="8"/><circle cx="400" cy="250" r="8"/></g>
  <circle cx="600" cy="410" r="9" fill="rgba(120,255,170,.25)" stroke="#78ffaa" stroke-width="2"/>
  <text x="600" y="432" fill="#78ffaa" font-size="10" text-anchor="middle" font-weight="bold">START</text>
  <circle cx="330" cy="215" r="9" fill="rgba(57,215,255,.25)" stroke="#39d7ff" stroke-width="2"/>
  <text x="330" y="200" fill="#39d7ff" font-size="10" text-anchor="middle" font-weight="bold">DESTINATION</text>
  <!-- vehicle -->
  <circle cx="530" cy="363" r="16" fill="rgba(57,215,255,.12)" stroke="#39d7ff" filter="url(#glow)"/>
  <path d="M530 351 L537 371 L530 366 L523 371 Z" fill="#39d7ff" stroke="#fff" transform="rotate(-58 530 363)"/>

  <!-- panels style -->
  <g fill="rgba(5,18,30,.86)" stroke="rgba(57,215,255,.45)">
    <rect x="290" y="10" width="380" height="34"/>      <!-- top bar -->
    <rect x="330" y="52" width="300" height="46"/>      <!-- guidance -->
    <rect x="16" y="110" width="170" height="330"/>     <!-- left -->
    <rect x="770" y="110" width="174" height="300"/>    <!-- right -->
    <rect x="16" y="470" width="928" height="74"/>      <!-- bottom -->
  </g>
  <!-- top bar -->
  <text x="480" y="32" fill="#e8fbff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3" filter="url(#glow)">MARS NAVIGATION</text>
  <text x="300" y="32" fill="#ffd27a" font-size="8">MY 39 · Ls 22°</text>
  <text x="598" y="32" fill="#9fe9ff" font-size="8">⚙ SETTINGS</text>
  <!-- guidance -->
  <text x="352" y="86" fill="#fff" font-size="30">↰</text>
  <text x="390" y="74" fill="#fff" font-size="14" font-weight="bold">Turn left <tspan fill="#39d7ff">in 1.2 km</tspan></text>
  <text x="390" y="90" fill="#9fe9ff" font-size="9">then ↗ bear right · 4.0 km</text>
  <!-- left panel -->
  <text x="26" y="128" fill="#39d7ff" font-size="9" font-weight="bold" letter-spacing="2">// ROUTE CONTROL</text>
  <circle cx="101" cy="178" r="36" fill="none" stroke="#39d7ff" stroke-width="1.5"/>
  <circle cx="101" cy="178" r="27" fill="none" stroke="rgba(57,215,255,.4)" stroke-dasharray="3 3"/>
  <path d="M101 146 L111 180 L91 180 Z" fill="#ffb347" transform="rotate(-58 101 178)" filter="url(#glow)"/>
  <text x="101" y="226" fill="#ffb347" font-size="8" text-anchor="middle" font-weight="bold">▲ CLIMB 6.2°</text>
  <g font-size="8.5" fill="#9fe9ff" font-weight="bold">
    <rect x="26" y="236" width="150" height="18" fill="none" stroke="rgba(57,215,255,.5)"/><text x="32" y="249">◎ SET START</text>
    <rect x="26" y="258" width="150" height="18" fill="none" stroke="rgba(57,215,255,.5)"/><text x="32" y="271">⌖ SET DESTINATION</text>
    <rect x="26" y="280" width="150" height="18" fill="none" stroke="rgba(255,90,90,.7)"/><text x="32" y="293" fill="#ffb0b0">⚠ ADD / REMOVE HAZARD</text>
    <rect x="26" y="302" width="150" height="18" fill="none" stroke="rgba(57,215,255,.5)"/><text x="32" y="315">⟲ ROUTE ▸</text>
    <rect x="26" y="324" width="150" height="18" fill="none" stroke="rgba(57,215,255,.5)"/><text x="32" y="337">❚❚ PAUSE</text>
    <rect x="26" y="346" width="150" height="18" fill="#39d7ff"/><text x="32" y="359" fill="#021018">◉ FOLLOW CAM</text>
    <rect x="26" y="368" width="150" height="18" fill="none" stroke="rgba(57,215,255,.5)"/><text x="32" y="381">⛶ ROUTE OVERVIEW</text>
    <rect x="26" y="390" width="150" height="18" fill="none" stroke="rgba(57,215,255,.5)"/><text x="32" y="403">✕ CLEAR</text>
  </g>
  <text x="26" y="428" fill="#ffd27a" font-size="8">Navigating…</text>
  <!-- right panel -->
  <g font-size="8" font-weight="bold">
    <rect x="780" y="118" width="50" height="16" fill="#39d7ff"/><text x="784" y="129" fill="#021018">TELEMETRY</text>
    <rect x="833" y="118" width="48" height="16" fill="none" stroke="rgba(57,215,255,.4)"/><text x="837" y="129" fill="#9fe9ff">WEATHER</text>
    <rect x="884" y="118" width="48" height="16" fill="none" stroke="rgba(57,215,255,.4)"/><text x="891" y="129" fill="#9fe9ff">LAYERS</text>
  </g>
  <g font-size="8.5">
    <text x="780" y="156" fill="#7fb8c8">ROUTE DIST</text><text x="934" y="156" fill="#e8fbff" text-anchor="end">19.1 km</text>
    <text x="780" y="174" fill="#7fb8c8">ETA</text><text x="934" y="174" fill="#e8fbff" text-anchor="end">2h 23m</text>
    <text x="780" y="192" fill="#7fb8c8">ELEV +/-</text><text x="934" y="192" fill="#e8fbff" text-anchor="end">+212 / -180 m</text>
    <text x="780" y="210" fill="#7fb8c8">MAX SLOPE</text><text x="934" y="210" fill="#e8fbff" text-anchor="end">15.6°</text>
    <text x="780" y="228" fill="#7fb8c8">HEADING</text><text x="934" y="228" fill="#e8fbff" text-anchor="end">302°</text>
    <text x="780" y="246" fill="#7fb8c8">HAZARDS</text><text x="934" y="246" fill="#e8fbff" text-anchor="end">1 + 2 craters</text>
    <text x="780" y="264" fill="#7fb8c8">RADIATION</text><text x="934" y="264" fill="#e8fbff" text-anchor="end">0.71 mSv/d</text>
    <text x="780" y="282" fill="#7fb8c8">SPEED</text><text x="934" y="282" fill="#e8fbff" text-anchor="end">8 km/h · 60×</text>
  </g>
  <rect x="780" y="300" width="154" height="30" fill="none" stroke="rgba(120,255,170,.6)"/>
  <text x="786" y="319" fill="#9dffc6" font-size="8">✓ ROUTE OK FOR THIS DEPARTURE</text>
  <!-- bottom -->
  <text x="28" y="490" fill="#39d7ff" font-size="9" font-weight="bold" letter-spacing="2">// TRAVERSE PROGRESS</text>
  <rect x="28" y="500" width="520" height="8" fill="none" stroke="rgba(57,215,255,.5)"/>
  <rect x="28" y="500" width="230" height="8" fill="#39d7ff" filter="url(#glow)"/>
  <text x="28" y="528" fill="#9fe9ff" font-size="9">8.4 km / 19.1 km · remaining 1h 20m</text>
  <rect x="580" y="478" width="350" height="58" fill="none" stroke="rgba(57,215,255,.3)"/>
  <rect x="790" y="478" width="40" height="58" fill="rgba(255,80,80,.25)"/>
  <path d="M584 520 L620 512 L660 516 L700 500 L740 494 L780 505 L820 498 L860 510 L926 504" fill="none" stroke="#39d7ff" stroke-width="1.5"/>
  <line x1="690" y1="478" x2="690" y2="536" stroke="#fff"/>
  <text x="584" y="490" fill="#9fe9ff" font-size="8">ELEVATION PROFILE</text>
</svg>
